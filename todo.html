    <section class="card">
      <h2>Task 8. Build a To-Do App</h2>
      <p>Add tasks, click a task to mark it completed, or delete it.</p>
      <form id="taskForm">
        <input id="taskInput" type="text" placeholder="Enter a task" autocomplete="off">
        <button type="submit">Add Task</button>
      </form>
      <p id="taskMessage" class="message"></p>
      <ul id="taskList" class="task-list"></ul>
      <p id="taskCount">Tasks: 0</p>
